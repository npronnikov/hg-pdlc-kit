    Запиши route строго из объявленных handlers: on_success, on_rework, on_clarify. При возврате обязательна конкретная rework_instruction.
  skill_refs:
  - hg-pdlc-method@3.0
  - hg-pdlc-quality@3.0
  subagent_refs:
  - hg-pdlc-qwen-business-analyst@3.0
  - hg-pdlc-qwen-acceptance-auditor@3.0
  produced_artifacts:
