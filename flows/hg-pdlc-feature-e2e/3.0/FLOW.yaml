- id: ai-prd-review
  title: Проверить бизнес-полноту и готовность к approval
  type: ai
  routing_type: dynamic
  execution_context:
  - type: artifact_ref
    node_id: ai-prd
    path: prd-index.md
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: human-interview
    path: questions.form.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_value
  instruction: |
    Вызови business-analyst и acceptance-auditor. Проверь все секции PRD, полноту бизнес-сценариев и BR/AC, источники и unknown.
    on_success: готово для ВП; on_rework: исправимая документальная ошибка; on_clarify: отсутствует бизнес-решение.
    Сохрани prd-review.md с finding IDs. Не подменяй решение ВП голосованием агентов.

    Общий контракт: hg-pdlc-method@3.0. Ресурсы skills доступны относительно фактически материализованного SKILL.md.
    Работать только в одной монорепе. Полезные документы создавать по project-путям; временные — по runtime run-путям.
