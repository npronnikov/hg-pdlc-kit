- id: b02-interview
  title: 02 · ВП подтверждает expected versus actual
  type: human_input
  execution_context:
  - type: artifact_ref
    node_id: b01-discover
    path: 00-context/interview.md
    scope: run
    required: true
    modifiable: true
    transfer_mode: by_ref
  instruction: |-
    Подтвердите ожидаемое поведение, observed failure, важность и ограничения исправления. Новую бизнес-политику пометьте как изменение, не баг. Не вставляйте реальные персональные данные/секреты.
    Не вставляйте пароли, токены или cookies. Submit отправляет ответы, но не утверждает требования. Отмена запуска доступна штатным Cancel.
  produced_artifacts:
  - scope: run
    path: 00-context/interview.md
    required: true
  expected_mutations: []
  on_submit:
    transition: b03-reproduce
  on_rework:
    transition: b01-discover
