    Замечания b14-final-approval: ${feedback1.rework_instruction}
    </#if>


    Обязательно выполни sdd-workspace-contract, затем профильные skills в перечисленном порядке.
    В bounded defect profile последовательно составьте бизнес delta/неизменные BR, затем architecture impact/no-impact с C4 ссылками и ADR, затем SYS/contract delta и regression test model. Существующее не переписывайте целиком: укажите exact baseline refs. Отсутствие влияния доказать, не пропустить раздел. Если нужна новая capability/политика/существенная architecture — blocker и полный feature flow. Получите три независимых review.

