---
id: pdlc-bmad-bootstrap
version: '2.0'
canonical_name: pdlc-bmad-bootstrap@2.0
title: 'BMAD brownfield: восстановление базы знаний'
description: Observed behavior и confirmed requirements раздельно; независимый audit
  и native human gate.
coding_agent: qwen
start_node_id: ai-intake
failure_node_id: terminal-blocked
fail_on_missing_declared_output: true
fail_on_missing_expected_mutation: false
nodes:
- id: ai-intake
  title: Зафиксировать область восстановления
  type: ai
  routing_type: static
  execution_context: []
  instruction: |
    HG run: ${run.id}
    Выполни hgpdlc-v2 init-binding --node ai-intake --run-id "${run.id}" --kind baseline.
    При отсутствии продуктового pdlc создай только seed-product, не ассоциируй это с отсутствием кода.
    <#if (run.feature_request)?? && run.feature_request?has_content>
    Область восстановления: ${run.feature_request}
    </#if>
    Старт immutable, без rework/retry.
    Выполни attached skills. Постоянные артефакты пишутся в binding.change_dir; run artifacts — в каталог текущей попытки HG SDLC. Файлы каталога доступны через hgpdlc-v2 catalog-root.
    Соблюдай границы полномочий. Учти runtime rework_instruction; не переписывай согласованные решения без возврата через нужный gate.
    Заверши hgpdlc-v2 ai-summary --node ai-intake --route <route> --action "фактическое действие". Разрешённые route: on_success.
  skill_refs:
  - pdlc-intake@2.0
  - pdlc-contracts@2.0
  - pdlc-authority@2.0
  - pdlc-e2e-evidence@2.0
  - pdlc-native-artifacts@2.0
  - pdlc-traceability@2.0
  produced_artifacts:
  - scope: run
    path: binding.json
    required: true
    modifiable: false
  - scope: project
    path: pdlc/changes/*/intent.md
    required: true
    modifiable: false
  expected_mutations: []
  on_success:
    transition: command-inventory
- id: command-inventory
  title: Снимок репозиториев и текущих документов
  type: command
  execution_context:
  - type: artifact_ref
    node_id: ai-intake
    path: binding.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: hgpdlc-v2 inventory --node command-inventory
  produced_artifacts:
  - scope: run
    path: report.json
    required: true
    modifiable: false
  - scope: run
    path: inventory.json
    required: false
    modifiable: false
  expected_mutations: []
  on_success:
    transition: ai-bootstrap
  on_blocked:
    transition: terminal-blocked
- id: ai-bootstrap
  title: Восстановить as-is и происхождение знаний
  type: ai
  routing_type: dynamic
  execution_context:
  - type: artifact_ref
    node_id: ai-intake
    path: binding.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: command-inventory
    path: inventory.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: |2

    Выполни attached skills. Постоянные артефакты пишутся в binding.change_dir; run artifacts — в каталог текущей попытки HG SDLC. Файлы каталога доступны через hgpdlc-v2 catalog-root.
    Соблюдай границы полномочий. Учти runtime rework_instruction; не переписывай согласованные решения без возврата через нужный gate.
    Исполни подключённую роль как subagent в отдельном контексте; сохрани фактическое заключение.
    Заверши hgpdlc-v2 ai-summary --node ai-bootstrap --route <route> --action "фактическое действие". Разрешённые route: on_success, on_blocked.
  skill_refs:
  - pdlc-bootstrap@2.0
  - pdlc-contracts@2.0
  - pdlc-authority@2.0
  - pdlc-e2e-evidence@2.0
  - pdlc-native-artifacts@2.0
  - pdlc-traceability@2.0
  produced_artifacts:
  - scope: project
    path: pdlc/changes/*/baseline/index.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/business.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/architecture.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/architecture.dsl
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/SRS.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/test-model.json
    required: false
    modifiable: false
  - scope: project
    path: pdlc/changes/*/baseline/facts.json
    required: false
    modifiable: false
  expected_mutations: []
  on_success:
    transition: ai-baseline-review
  subagent_refs:
  - pdlc-repository-scout@2.0
  on_blocked:
    transition: terminal-blocked
- id: ai-baseline-review
  title: Независимая проверка recovered baseline
  type: ai
  routing_type: dynamic
  execution_context:
  - type: artifact_ref
    node_id: ai-intake
    path: binding.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: command-inventory
    path: inventory.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: ai-bootstrap
    path: pdlc/changes/*/baseline/index.md
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: ai-bootstrap
    path: pdlc/changes/*/baseline/facts.json
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: |2

    Выполни attached skills. Постоянные артефакты пишутся в binding.change_dir; run artifacts — в каталог текущей попытки HG SDLC. Файлы каталога доступны через hgpdlc-v2 catalog-root.
    Соблюдай границы полномочий. Учти runtime rework_instruction; не переписывай согласованные решения без возврата через нужный gate.
    Исполни подключённую роль как subagent в отдельном контексте; сохрани фактическое заключение.
    Заверши hgpdlc-v2 ai-summary --node ai-baseline-review --route <route> --action "фактическое действие". Разрешённые route: on_success, on_rework, on_blocked.
  skill_refs:
  - pdlc-baseline-review@2.0
  - pdlc-contracts@2.0
  - pdlc-authority@2.0
  - pdlc-e2e-evidence@2.0
  - pdlc-native-artifacts@2.0
  - pdlc-traceability@2.0
  produced_artifacts:
  - scope: run
    path: review.json
    required: true
    modifiable: false
  expected_mutations: []
  on_success:
    transition: command-baseline-check
  subagent_refs:
  - pdlc-baseline-auditor@2.0
  on_rework:
    transition: ai-bootstrap
    max_loop_count: 8
    keep_changes: true
    session_policy: new_session
  on_blocked:
    transition: terminal-blocked
- id: command-baseline-check
  title: Валидировать baseline и неизменность входов
  type: command
  execution_context:
  - type: artifact_ref
    node_id: ai-intake
    path: binding.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: ai-baseline-review
    path: review.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: ai-bootstrap
    path: pdlc/changes/*/baseline/facts.json
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: hgpdlc-v2 baseline-check --node command-baseline-check
  produced_artifacts:
  - scope: run
    path: report.json
    required: true
    modifiable: false
  - scope: run
    path: baseline-digest.json
    required: false
    modifiable: false
  expected_mutations: []
  on_success:
    transition: human-baseline
  on_blocked:
    transition: terminal-blocked
  on_rework:
    transition: ai-bootstrap
    max_loop_count: 8
    keep_changes: true
    session_policy: new_session
- id: human-baseline
  title: Принять базу знаний, сохранив неизвестное
  type: human_approval
  execution_context:
  - type: artifact_ref
    node_id: ai-bootstrap
    path: pdlc/changes/*/baseline/index.md
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: ai-bootstrap
    path: pdlc/changes/*/baseline/facts.json
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: command-baseline-check
    path: report.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: Изучи предъявленные артефакты и основания. Approve принимает только
    предъявленную версию; Rework должен назвать нарушение и требуемое изменение. Автор/время/действие
    сохраняются нативным аудитом HG. Не нужно переносить файлы или писать следующий
    prompt.
  produced_artifacts: []
  expected_mutations: []
  allowed_roles:
  - PRODUCT_OWNER
  on_approve:
    transition: command-baseline-seal
  on_rework:
    transition: ai-bootstrap
- id: command-baseline-seal
  title: Подготовить принятую базу в pdlc/product
  type: command
  execution_context:
  - type: artifact_ref
    node_id: ai-intake
    path: binding.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: command-baseline-check
    path: baseline-digest.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: command-inventory
    path: inventory.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: hgpdlc-v2 baseline-seal --node command-baseline-seal
  produced_artifacts:
  - scope: run
    path: report.json
    required: true
    modifiable: false
  - scope: project
    path: pdlc/product/context.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/business/overview.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/architecture/architecture.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/architecture/architecture.dsl
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/system/SRS.md
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/tests/model.json
    required: false
    modifiable: false
  - scope: project
    path: pdlc/product/trace/facts.json
    required: false
    modifiable: false
  expected_mutations: []
  on_success:
    transition: terminal-baseline
  on_blocked:
    transition: terminal-blocked
- id: terminal-baseline
  title: Baseline prepared — документы не merged
  type: terminal
  execution_context: []
  produced_artifacts: []
  expected_mutations: []
- id: terminal-blocked
  title: Blocked — база не принята
  type: terminal
  execution_context: []
  produced_artifacts: []
  expected_mutations: []
