    node_id: f03-prd
    path: 10-business/prd.md
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: f03-prd
    path: 10-business/business-review.md
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  - type: artifact_ref
    node_id: f03-prd
    path: 10-business/manifest.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: |-
    Примите проблему, цели, scope/out-of-scope, BR/RULE, роли/права, исключения и AC. Все must-have вопросы должны иметь ответы. Это бизнес-решение, не согласование красивого текста.
    Approve относится только к показанной версии/manifest hash, а не к будущим изменениям. При замечаниях выберите Rework и укажите конкретные ID/критерии; при прекращении работы — Cancel run. Не разрешайте считать невыполненные/красные обязательные тесты успешными.
  produced_artifacts: []
  expected_mutations: []
  on_approve:
    transition: f05-architecture
  on_rework:
    transition: f03-prd
