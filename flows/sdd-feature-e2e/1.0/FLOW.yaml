    Обязательно выполни sdd-workspace-contract, затем профильные skills в перечисленном порядке.
    По принятому PRD спроектируйте architecture delta: C4 context/container, runtime основной и отказный сценарий, данные/границы/security/testability и ADR. Сравните варианты; не навязывайте новый стек. Зафиксируйте receipt business gate и вызовите независимого architecture-auditor.

