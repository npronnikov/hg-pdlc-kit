- id: f02-interview
  title: 02 · ВП отвечает на вопросы
  type: human_input
  execution_context:
  - type: artifact_ref
    node_id: f01-discover
    path: 00-context/interview.md
    scope: run
    required: true
    modifiable: true
    transfer_mode: by_ref
  instruction: |-
    Прочитайте карту контекста и заполните поля [Answer] в interview.md. Проверьте scope, роли, правила, исключения, метрики и критерии результата. Неизвестное обозначьте явно; техническую реализацию выбирать вместо архитектора не требуется.
    Не вставляйте пароли, токены или cookies. Submit отправляет ответы, но не утверждает требования. Отмена запуска доступна штатным Cancel.
  produced_artifacts:
  - scope: run
    path: 00-context/interview.md
    required: true
  expected_mutations: []
  on_submit:
    transition: f03-prd
  on_rework:
    transition: f01-discover
