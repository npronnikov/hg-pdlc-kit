    python3 - <<'PDLC_COMMAND_PY'
    import hashlib, json, subprocess, sys
    from pathlib import Path
    p=Path("pdlc/tooling/verify.py")
    if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != "8c0a631891979d0c2978a863fa71811963fd694c880c0f09c0bb05d1f7c36a6a":
        raise SystemExit("Verifier missing/changed; stop, do not regenerate it with an AI node")
    data=json.loads(r"""{"run_id":"${run.id?json_string}"}""")
    args=['check', '--report', 'prd-check.json', '--change', 'CHANGE', '--stage', 'prd']
    args=["pdlc/changes/"+data["run_id"] if x=="CHANGE" else x for x in args]
    args += ["--run-id",data["run_id"]]
    raise SystemExit(subprocess.run([sys.executable,str(p)]+args,check=False).returncode)
    PDLC_COMMAND_PY
