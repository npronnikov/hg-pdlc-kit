- id: command-code-check
  title: Проверить stories→реальный код
  type: command
  execution_context:
  - type: artifact_ref
    node_id: ai-implement
    path: pdlc/changes/*/implementation-map.json
    scope: project
    required: true
    modifiable: false
    transfer_mode: by_ref
  instruction: |-
    set -euo pipefail
    python3 - <<'PDLC_COMMAND_PY'
    import hashlib, json, subprocess, sys
    from pathlib import Path
    p=Path("pdlc/tooling/verify.py")
    if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != "8c0a631891979d0c2978a863fa71811963fd694c880c0f09c0bb05d1f7c36a6a":
        raise SystemExit("Verifier missing/changed; stop, do not regenerate it with an AI node")
    data=json.loads(r"""{"run_id":"${run.id?json_string}"}""")
    args=['check', '--report', 'code-check.json', '--change', 'CHANGE', '--stage', 'code']
    args=["pdlc/changes/"+data["run_id"] if x=="CHANGE" else x for x in args]
    args += ["--run-id",data["run_id"]]
    raise SystemExit(subprocess.run([sys.executable,str(p)]+args,check=False).returncode)
    PDLC_COMMAND_PY
  produced_artifacts:
  - scope: run
    path: code-check.json
    required: true
    modifiable: false
  - scope: project
    path: pdlc/changes/*/trace/graph.json
    required: true
    modifiable: false
  - scope: project
    path: pdlc/changes/*/trace/matrix.md
    required: true
    modifiable: false
