- id: r02-interview
  title: 02 · ВП подтверждает смысл и известные исключения
  type: human_input
  execution_context:
  - type: artifact_ref
    node_id: r01-discover
    path: 00-context/interview.md
    scope: run
    required: true
    modifiable: true
    transfer_mode: by_ref
  instruction: |-
    Подтвердите пользователей, бизнес-смысл, ожидаемые правила и известные проблемы текущей системы. Отделите «так сейчас работает» от «так должно работать». Допустимо указать unknown; новые пожелания выделяйте отдельно, они не реализуются этим flow.
    Не вставляйте пароли, токены или cookies. Submit отправляет ответы, но не утверждает требования. Отмена запуска доступна штатным Cancel.
  produced_artifacts:
  - scope: run
    path: 00-context/interview.md
    required: true
  expected_mutations: []
  on_submit:
    transition: r03-business
  on_rework:
    transition: r01-discover
