- id: r10-seal
  title: 10 · Зафиксировать принятую baseline-документацию
  type: ai
  routing_type: dynamic
  execution_context:
  - type: artifact_ref
    node_id: r08-baseline-pack
    path: 70-acceptance/acceptance.json
    scope: run
    required: true
    modifiable: false
    transfer_mode: by_ref
