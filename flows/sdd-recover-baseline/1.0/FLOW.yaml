    required: true
    modifiable: false
  - scope: run
    path: 71-seal/backups/*/content.txt
    required: false
    modifiable: false
  on_success:
    transition: sdd-recover-baseline-done
  on_rework:
    transition: r08-baseline-pack
    max_loop_count: 3
    keep_changes: true
    session_policy: new_session
