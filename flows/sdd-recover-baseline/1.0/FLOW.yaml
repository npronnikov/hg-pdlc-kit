  instruction: |-
    Примите достоверность бизнес-картины, различие observed/desired и список неизвестного. Не утверждайте inferred claim как факт без подтверждения. Это не признание текущего продукта бездефектным.
    Approve относится только к показанной версии/manifest hash, а не к будущим изменениям. При замечаниях выберите Rework и укажите конкретные ID/критерии; при прекращении работы — Cancel run. Не разрешайте считать невыполненные/красные обязательные тесты успешными.
  produced_artifacts: []
  on_approve:
    transition: r05-architecture
  on_rework:
